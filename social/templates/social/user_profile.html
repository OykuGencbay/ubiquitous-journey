<h1>{{ profile_user.username }}'s Profile</h1>
<p><strong>Friends:</strong> {{ friend_count }}</p>
<a href="/">Home</a>
{% if profile.profile_picture %}
    <img src="{{ profile.profile_picture.url }}" width="150">
{% else %}
    <p>No profile picture yet.</p>
{% endif %}
<hr>
<h2>Posts</h2>
</hr>
{% for post in posts %}
    <div>
        <p>{{ post.text }}</p>
        <small>{{ post.created_at }}</small>
    </div>
    <hr>
{% empty %}
    <p>This user has not posted yet.</p>
{% endfor %}
