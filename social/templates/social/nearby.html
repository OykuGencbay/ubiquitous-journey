<h1>Add Nearby Friend</h1>
<button onclick="scanBluetooth()">Scan Nearby</button>
<p id="status"></p>
<script>
async function scanBluetooth() {
    const status = document.getElementById("status");
    if (!navigator.bluetooth) {
        status.innerText = "Bluetooth is not supported in this browser.";
        return;
    }
    try {
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true
        });
        status.innerText = "Found device: " + (device.name || "Unnamed device");
    } catch (error) {
        status.innerText = "Bluetooth scan cancelled or failed.";
    }
}
</script>
